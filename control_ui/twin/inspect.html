<!doctype html><html><head><script type="importmap">{"imports":{"three":"./vendor/package/build/three.module.js","three/addons/":"./vendor/package/examples/jsm/"}}</script></head><body style="margin:0;background:#18232d;color:white"><script type="module">
import * as T from 'three';import {STLLoader} from 'three/addons/loaders/STLLoader.js';
const parts=await(await fetch('assets/components.json')).json();
window.inspect=async(name)=>{document.body.replaceChildren();for(const p of parts.filter(p=>name.split(',').some(n=>p.parent.startsWith(n))).slice(0,8)){const row=document.createElement('div');row.style.display='flex';document.body.append(row);const g=await new STLLoader().loadAsync('assets/'+p.file);g.center();g.computeVertexNormals();for(const [label,dir] of [['front XY',[0,0,1]],['side ZY',[1,0,0]],['top XZ',[0,1,0]],['angle',[1,1,1]]]){const box=document.createElement('div');box.innerText=p.parent+' #'+p.component+' '+label;row.append(box);const r=new T.WebGLRenderer({antialias:true});r.setSize(350,300);const s=new T.Scene();s.background=new T.Color('#18232d');s.add(new T.HemisphereLight(0xffffff,0x445566,3));const light=new T.DirectionalLight(0xffffff,3);light.position.set(50,100,150);s.add(light);const mesh=new T.Mesh(g,new T.MeshStandardMaterial({color:0xc9d6e0,side:T.DoubleSide}));s.add(mesh);s.add(new T.AxesHelper(50));const c=new T.OrthographicCamera(-80,80,69,-69,.1,1000);c.position.set(...dir).multiplyScalar(300);c.lookAt(0,0,0);r.render(s,c);const img=new Image();img.src=r.domElement.toDataURL();box.append(img);r.dispose();r.forceContextLoss();}}};
</script></body></html>
